name: 대시보드 업데이트 알림 발송

on:
  push:
    branches:
      - main
    paths:
      - 'marketer.html'
      - 'partleader.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃 (전체 이력 포함)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install PyJWT cryptography

      - name: 변경 파일 확인
        id: changes
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          # 최초 푸시 등으로 before가 없는 경우(전부 0) → 직전 커밋과 비교
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            echo "before 값이 없어 HEAD~1과 비교합니다"
            git diff --name-only HEAD~1 "$AFTER" > changed_files.txt || git diff --name-only "$AFTER" > changed_files.txt
          else
            git diff --name-only "$BEFORE" "$AFTER" > changed_files.txt
          fi

          echo "===== 이번 푸시에서 변경된 파일 목록 ====="
          cat changed_files.txt
          echo "========================================"

          if grep -q 'marketer.html' changed_files.txt; then
            echo "marketer=1" >> $GITHUB_OUTPUT
          else
            echo "marketer=0" >> $GITHUB_OUTPUT
          fi
          if grep -q 'partleader.html' changed_files.txt; then
            echo "partleader=1" >> $GITHUB_OUTPUT
          else
            echo "partleader=0" >> $GITHUB_OUTPUT
          fi

      - name: 알림 발송
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MARKETER_CHANGED: ${{ steps.changes.outputs.marketer }}
          PARTLEADER_CHANGED: ${{ steps.changes.outputs.partleader }}
        run: python send_notify.py
