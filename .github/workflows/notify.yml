name: 대시보드 업데이트 알림 발송

on:
  push:
    branches:
      - main
    paths:
      - 'marketer.html'
      - 'partleader.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Python 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install PyJWT cryptography

      - name: 변경 파일 확인 및 알림 발송
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python send_notify.py "${{ toJson(github.event.commits) }}"
