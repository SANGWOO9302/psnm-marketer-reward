name: 대시보드 업데이트 알림 발송

on:
  push:
    branches:
      - main
    paths:
      - 'marketer.html'
      - 'partleader.html'

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Access Token 발급
        id: token
        run: |
          pip install PyJWT cryptography -q
          python3 << 'PYEOF'
import json, time, os
import jwt
import urllib.request

sa = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])

now = int(time.time())
payload = {
  "iss": sa["client_email"],
  "scope": "https://www.googleapis.com/auth/firebase.messaging",
  "aud": "https://oauth2.googleapis.com/token",
  "iat": now,
  "exp": now + 3600
}
signed = jwt.encode(payload, sa["private_key"], algorithm="RS256")

data = f"grant_type=urn%3Aietf%3Aparams%3Aoauth2%3Agrant-type%3Ajwt-bearer&assertion={signed}".encode()
req = urllib.request.Request("https://oauth2.googleapis.com/token", data=data)
res = urllib.request.urlopen(req)
token = json.loads(res.read())["access_token"]

with open(os.environ["GITHUB_OUTPUT"], "a") as f:
  f.write(f"access_token={token}\n")
PYEOF
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 마케터 대시보드 알림 발송
        if: contains(toJson(github.event.commits.*.modified), 'marketer.html') || contains(toJson(github.event.commits.*.added), 'marketer.html')
        run: |
          curl -s -X POST \
            "https://fcm.googleapis.com/v1/projects/psnm-wholesale-reward/messages:send" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "message": {
                "topic": "all-users",
                "notification": {
                  "title": "📊 마케터 성과보상 대시보드 업데이트",
                  "body": "새로운 성과보상 대시보드가 업로드되었습니다. 확인해보세요!"
                },
                "webpush": {
                  "fcm_options": {
                    "link": "https://sangwoo9302.github.io/psnm-marketer-reward/marketer.html"
                  }
                }
              }
            }'
          echo "마케터 알림 발송 완료"

      - name: 파트장 대시보드 알림 발송
        if: contains(toJson(github.event.commits.*.modified), 'partleader.html') || contains(toJson(github.event.commits.*.added), 'partleader.html')
        run: |
          curl -s -X POST \
            "https://fcm.googleapis.com/v1/projects/psnm-wholesale-reward/messages:send" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -H "Content-Type: application/json" \
            -d '{
              "message": {
                "topic": "all-users",
                "notification": {
                  "title": "📊 파트장 KPI 대시보드 업데이트",
                  "body": "새로운 파트장 KPI 대시보드가 업로드되었습니다. 확인해보세요!"
                },
                "webpush": {
                  "fcm_options": {
                    "link": "https://sangwoo9302.github.io/psnm-marketer-reward/partleader.html"
                  }
                }
              }
            }'
          echo "파트장 알림 발송 완료"
