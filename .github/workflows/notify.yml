name: 대시보드 업데이트 알림 발송

on:
  push:
    branches:
      - main
    paths:
      - 'marketer.html'
      - 'partleader.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Python 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install PyJWT cryptography

      - name: 변경 파일 확인
        id: changes
        run: |
          git diff --name-only HEAD~1 HEAD > changed_files.txt
          cat changed_files.txt
          echo "marketer=$(grep -c 'marketer.html' changed_files.txt || true)" >> $GITHUB_OUTPUT
          echo "partleader=$(grep -c 'partleader.html' changed_files.txt || true)" >> $GITHUB_OUTPUT

      - name: 알림 발송
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MARKETER_CHANGED: ${{ steps.changes.outputs.marketer }}
          PARTLEADER_CHANGED: ${{ steps.changes.outputs.partleader }}
        run: python send_notify.py
