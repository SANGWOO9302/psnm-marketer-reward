<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메시지함 - 관리자 전용</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR',sans-serif; background:#f0f4f8; color:#1e293b; }

/* 로그인 화면 */
#loginScreen {
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:24px;
  background: linear-gradient(135deg,#00332E,#00665E,#00897B);
}
#loginScreen .box { width:100%; max-width:340px; }
#loginScreen .title { color:#fff; font-size:19px; font-weight:700; text-align:center; margin-bottom:24px; }
#loginScreen input {
  width:100%; padding:13px 14px; margin-bottom:10px;
  border:1.5px solid rgba(255,255,255,.25); border-radius:10px;
  background:rgba(255,255,255,.12); color:#fff; font-size:14px; outline:none;
}
#loginScreen input::placeholder { color:rgba(255,255,255,.45); }
#loginScreen button {
  width:100%; padding:13px; border:none; border-radius:10px;
  background:linear-gradient(135deg,#00897B,#14B8A6); color:#fff;
  font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
}
#loginErr { color:#fca5a5; font-size:12px; text-align:center; margin-top:10px; min-height:16px; }

/* 메시지함 화면 */
#appScreen { display:none; max-width:820px; margin:0 auto; padding:20px 16px 60px; }
.hd { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.hd h1 { font-size:18px; font-weight:700; }
.hd button { background:none; border:1px solid #cbd5e1; padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; color:#64748b; }

.filters { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.filters button {
  padding:6px 14px; border-radius:16px; border:1px solid #e2e8f0; background:#fff;
  font-size:12px; cursor:pointer; color:#64748b; font-family:inherit;
}
.filters button.on { background:#00665E; color:#fff; border-color:#00665E; }

.msg-card { background:#fff; border-radius:12px; padding:16px 18px; margin-bottom:10px; border:1px solid #e2e8f0; }
.msg-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }

/* 점3개 메뉴 */
.menu-wrap { position:relative; }
.menu-btn {
  background:none; border:none; font-size:20px; color:#94a3b8; cursor:pointer;
  padding:2px 8px; border-radius:6px; line-height:1;
}
.menu-btn:hover { background:#f1f5f9; }
.menu-dropdown {
  display:none; position:absolute; top:28px; right:0; z-index:100;
  background:#fff; border:1px solid #e2e8f0; border-radius:10px;
  box-shadow:0 4px 16px rgba(0,0,0,.12); min-width:110px; overflow:hidden;
}
.menu-dropdown.show { display:block; }
.menu-item {
  display:block; width:100%; text-align:left; padding:10px 14px;
  background:none; border:none; font-size:13px; cursor:pointer; font-family:inherit;
}
.menu-item:hover { background:#f8fafc; }
.menu-item.danger { color:#dc2626; }
.menu-item.danger:hover { background:#fef2f2; }

/* 삭제 확인 모달 */
.confirm-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.5);
  z-index:1000; align-items:center; justify-content:center; padding:20px;
}
.confirm-overlay.show { display:flex; }
.confirm-box { background:#fff; border-radius:14px; padding:22px; max-width:320px; width:100%; text-align:center; }
.confirm-box .icon { font-size:36px; margin-bottom:10px; }
.confirm-box .msg { font-size:14px; color:#334155; margin-bottom:20px; line-height:1.5; }
.confirm-box .btns { display:flex; gap:8px; }
.confirm-box button { flex:1; padding:11px; border-radius:8px; border:none; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
.confirm-cancel { background:#e2e8f0; color:#1e293b; }
.confirm-delete { background:#dc2626; color:#fff; }
.msg-who { font-size:13px; font-weight:700; }
.msg-meta { font-size:11px; color:#94a3b8; margin-top:2px; }
.msg-cat { font-size:11px; font-weight:600; padding:2px 8px; border-radius:8px; background:#eff6ff; color:#00897B; display:inline-block; margin-bottom:8px; }
.msg-content { font-size:13px; line-height:1.6; color:#334155; white-space:pre-wrap; margin-bottom:10px; }
.msg-bottom { display:flex; justify-content:space-between; align-items:center; }
.msg-time { font-size:11px; color:#94a3b8; }
.status-select {
  padding:5px 10px; border-radius:8px; border:1px solid #e2e8f0; font-size:12px; font-family:inherit;
}
.status-접수 { color:#dc2626; }
.status-확인중 { color:#d97706; }
.status-완료 { color:#16a34a; }

.empty { text-align:center; color:#94a3b8; font-size:13px; padding:60px 0; }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginScreen">
  <div class="box">
    <div class="title">📥 메시지함 (관리자 전용)</div>
    <input type="email" id="adminEmail" placeholder="관리자 이메일">
    <input type="password" id="adminPw" placeholder="비밀번호" onkeydown="if(event.key==='Enter') adminLogin()">
    <button onclick="adminLogin()">로그인</button>
    <div id="loginErr"></div>
  </div>
</div>

<!-- 메시지함 화면 -->
<div id="appScreen">
  <div class="hd">
    <h1>📥 담당자 메시지함</h1>
    <button onclick="adminLogout()">로그아웃</button>
  </div>
  <div class="filters">
    <button class="on" data-f="all" onclick="setFilter('all')">전체</button>
    <button data-f="접수" onclick="setFilter('접수')">접수</button>
    <button data-f="확인중" onclick="setFilter('확인중')">확인중</button>
    <button data-f="완료" onclick="setFilter('완료')">완료</button>
  </div>
  <div id="msgList"></div>
</div>

<!-- 삭제 확인 모달 -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="icon">🗑</div>
    <div class="msg">이 문의를 삭제하시겠습니까?<br><span style="color:#94a3b8;font-size:12px;">삭제 후에는 복구할 수 없습니다.</span></div>
    <div class="btns">
      <button class="confirm-cancel" onclick="closeConfirm()">취소</button>
      <button class="confirm-delete" onclick="doDelete()">삭제</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDGU5cSiIA4ihm_7IgMDCXw6WZFY6cHnJY",
  authDomain: "psnm-wholesale-reward.firebaseapp.com",
  projectId: "psnm-wholesale-reward",
  storageBucket: "psnm-wholesale-reward.firebasestorage.app",
  messagingSenderId: "1064215508901",
  appId: "1:1064215508901:web:38ee1c80cd1a5acc8b1a4c",
  measurementId: "G-TWLRNXQRT9"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let allMessages = [];
let currentFilter = 'all';

function adminLogin() {
  const email = document.getElementById('adminEmail').value.trim();
  const pw = document.getElementById('adminPw').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '';
  auth.signInWithEmailAndPassword(email, pw)
    .catch(err => {
      errEl.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
    });
}

function adminLogout() {
  auth.signOut();
}

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    loadMessages();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display = 'none';
  }
});

function loadMessages() {
  db.collection('messages').orderBy('createdAt', 'desc').onSnapshot(snapshot => {
    allMessages = [];
    snapshot.forEach(doc => allMessages.push({ id: doc.id, ...doc.data() }));
    renderMessages();
  }, err => {
    document.getElementById('msgList').innerHTML = '<div class="empty">메시지를 불러오지 못했습니다: ' + err.message + '</div>';
  });
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filters button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
  renderMessages();
}

function renderMessages() {
  const list = document.getElementById('msgList');
  const filtered = currentFilter === 'all' ? allMessages : allMessages.filter(m => m.status === currentFilter);

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">해당하는 메시지가 없습니다.</div>';
    return;
  }

  list.innerHTML = filtered.map(m => {
    const roleKo = m.role === 'marketer' ? '마케터' : (m.role === 'partleader' ? '파트장' : m.role);
    const time = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleString('ko-KR') : '';
    return `
      <div class="msg-card">
        <div class="msg-top">
          <div>
            <div class="msg-who">${m.name} <span style="color:#94a3b8;font-weight:400;">(${roleKo} · ${m.sabun})</span></div>
          </div>
          <div class="menu-wrap">
            <button class="menu-btn" onclick="toggleMenu(event, '${m.id}')">⋮</button>
            <div class="menu-dropdown" id="menu-${m.id}">
              <button class="menu-item danger" onclick="confirmDelete('${m.id}')">🗑 삭제</button>
            </div>
          </div>
        </div>
        <div class="msg-cat">${m.category}</div>
        <div class="msg-content">${escapeHtml(m.content)}</div>
        <div class="msg-bottom">
          <div class="msg-time">${time}</div>
          <select class="status-select status-${m.status}" onchange="updateStatus('${m.id}', this.value)">
            <option value="접수" ${m.status==='접수'?'selected':''}>접수</option>
            <option value="확인중" ${m.status==='확인중'?'selected':''}>확인중</option>
            <option value="완료" ${m.status==='완료'?'selected':''}>완료</option>
          </select>
        </div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function updateStatus(id, newStatus) {
  try {
    const update = { status: newStatus };
    if (newStatus === '완료') {
      update.notified = false; // 완료 처리 시 → 스케줄러가 알림 발송 후 true로 전환
    }
    await db.collection('messages').doc(id).update(update);
  } catch (e) {
    alert('상태 변경 실패: ' + e.message);
  }
}

// ===== 점3개 메뉴 & 삭제 =====
let pendingDeleteId = null;

function toggleMenu(event, id) {
  event.stopPropagation();
  const dropdown = document.getElementById('menu-' + id);
  const isOpen = dropdown.classList.contains('show');
  document.querySelectorAll('.menu-dropdown.show').forEach(el => el.classList.remove('show'));
  if (!isOpen) dropdown.classList.add('show');
}

document.addEventListener('click', () => {
  document.querySelectorAll('.menu-dropdown.show').forEach(el => el.classList.remove('show'));
});

function confirmDelete(id) {
  document.querySelectorAll('.menu-dropdown.show').forEach(el => el.classList.remove('show'));
  pendingDeleteId = id;
  document.getElementById('confirmOverlay').classList.add('show');
}

function closeConfirm() {
  pendingDeleteId = null;
  document.getElementById('confirmOverlay').classList.remove('show');
}

async function doDelete() {
  if (!pendingDeleteId) return;
  try {
    await db.collection('messages').doc(pendingDeleteId).delete();
    closeConfirm();
  } catch (e) {
    alert('삭제 실패: ' + e.message);
    closeConfirm();
  }
}
</script>
</body>
</html>
